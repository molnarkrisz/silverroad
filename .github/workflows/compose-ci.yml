name: Compose validation

on:
  push:
    paths:
      - 'compose.yaml'
      - '.github/workflows/compose-ci.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - '.github/workflows/compose-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet
